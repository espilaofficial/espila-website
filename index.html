<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espila is Born</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Mr+Dafoe&family=Noto+Sans+Devanagari:wght@600;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#0d0020;display:flex;align-items:center;justify-content:center;font-family:'Montserrat','Segoe UI',Arial,sans-serif}

  .poster{
    --u:min(1vw,.75vh);
    position:relative;overflow:hidden;
    width:100vw;height:100vh;height:100dvh;
    background:
      radial-gradient(ellipse 60% 45% at 50% 28%,rgba(255,170,30,.40) 0,rgba(255,120,0,0) 70%),
      radial-gradient(ellipse at 50% 55%,#6a14c4 0%,#3d0b86 45%,#1c0442 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  }
  .fx{position:absolute;inset:0;pointer-events:none}
  .fx i{position:absolute;display:block}

  .c{opacity:.95;box-shadow:0 0 calc(1.2 * var(--u)) currentColor}
  .sp{
    background:currentColor;
    clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);
    filter:drop-shadow(0 0 calc(1 * var(--u)) currentColor);
    animation:tw var(--d,2.4s) ease-in-out var(--dl,0s) infinite;
  }
  @keyframes tw{0%,100%{opacity:.25;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(20deg)}}

  .star{width:calc(34 * var(--u));height:calc(34 * var(--u));position:relative;z-index:1;margin-bottom:calc(-1 * var(--u));
    filter:drop-shadow(0 0 calc(3 * var(--u)) #ffb21e) drop-shadow(0 0 calc(7 * var(--u)) rgba(255,140,0,.8));
    animation:pulse 3s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

  .espila{
    position:relative;z-index:1;font-weight:800;font-size:calc(21 * var(--u));line-height:1;letter-spacing:-.01em;color:#fff;
    text-shadow:calc(.4 * var(--u)) calc(.4 * var(--u)) 0 #3a0f78,calc(.8 * var(--u)) calc(.8 * var(--u)) 0 #25094d,
      0 0 calc(2 * var(--u)) rgba(255,255,255,.55),0 0 calc(6 * var(--u)) rgba(200,120,255,.7),0 calc(1.8 * var(--u)) calc(3 * var(--u)) rgba(0,0,0,.5);
  }
  .is{
    position:relative;z-index:1;font-family:'Mr Dafoe',cursive;font-size:calc(10 * var(--u));line-height:1;margin-top:calc(-1 * var(--u));color:#fff;
    text-shadow:0 0 calc(1.5 * var(--u)) #fff,0 0 calc(4 * var(--u)) #ff9bf0;
  }
  .born{
    position:relative;z-index:1;margin-top:calc(1.5 * var(--u));
    font-weight:800;font-size:calc(19 * var(--u));line-height:1;letter-spacing:.01em;
    background:linear-gradient(110deg,#ffe27a 0%,#ffbf14 25%,#fff6b0 45%,#ffb400 62%,#ffd84a 80%,#ff9d00 100%);
    background-size:220% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(calc(.4 * var(--u)) calc(.5 * var(--u)) 0 #7a4600) drop-shadow(0 0 calc(2 * var(--u)) rgba(255,190,20,.9)) drop-shadow(0 0 calc(5 * var(--u)) rgba(255,150,0,.6));
    animation:shine 4s linear infinite;
  }
  @keyframes shine{0%{background-position:100% 0}100%{background-position:-120% 0}}

  .tag{
    position:relative;z-index:1;margin-top:calc(7 * var(--u));
    font-weight:600;font-size:calc(4 * var(--u));letter-spacing:.28em;text-transform:uppercase;color:#fff;
    text-shadow:0 0 calc(1.4 * var(--u)) rgba(255,255,255,.6),0 calc(.4 * var(--u)) calc(1 * var(--u)) rgba(0,0,0,.7);
  }
  .tag b{color:#ffc21a;font-weight:800;text-shadow:0 0 calc(2 * var(--u)) #ff9d00}

  @media (prefers-reduced-motion:reduce){.sp,.star,.born{animation:none}}

  /* ===== दीपावली की सजावट (6–10 नवंबर 2026) ===== */
  .dw{display:none;pointer-events:none}
  .diwali .dw{display:block}
  .diwali .poster{--u:min(.82vw,.56vh);padding:calc(var(--toran) + 10px) 0 150px;--toran:100px}
  .dw-toran{position:absolute;top:0;left:0;width:100%;height:var(--toran,100px);z-index:4;background:url(https://espilamail.com/dw-toran.webp) center top/auto 100% repeat-x}
  .dw-cas{position:absolute;top:0;width:235px;z-index:5}
  .dw-cas.l{left:-6px}.dw-cas.r{right:-6px;transform:scaleX(-1)}
  .dw-cor{position:absolute;bottom:0;width:340px;z-index:3}
  .dw-cor.l{left:0}.dw-cor.r{right:0;transform:scaleX(-1)}
  .dw-row{position:absolute;bottom:34px;left:380px;right:380px;display:flex;justify-content:space-between;align-items:flex-end;z-index:3}
  .diwali .dw-row{display:flex}
  .dw-row span{display:block;width:48px;height:42px;position:relative}
  .dw-row img{width:100%;height:100%;object-fit:contain;opacity:0;animation:dwlight .4s ease-out forwards}
  @keyframes dwlight{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
  .dw-hang{position:absolute;top:0;z-index:4;transform-origin:50% 0;animation:dwswing 3.2s ease-in-out infinite}
  .dw-hang img{display:block;width:100%}
  @keyframes dwswing{0%,100%{transform:rotate(3.5deg)}50%{transform:rotate(-3.5deg)}}
  .dw-glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,214,90,.8) 0,rgba(255,170,0,.3) 45%,rgba(255,170,0,0) 70%);animation:dwg 1.5s ease-in-out infinite;mix-blend-mode:screen}
  @keyframes dwg{0%,100%{opacity:.55;transform:scale(1)}30%{opacity:1;transform:scale(1.12,1.2)}60%{opacity:.7;transform:scale(.95,1.05)}}
  .fest{display:none;position:relative;z-index:1;margin-top:calc(3.5 * var(--u));font-family:'Noto Sans Devanagari','Montserrat',sans-serif;font-weight:800;font-size:clamp(18px,calc(5 * var(--u)),40px);color:#ffd24a;text-shadow:0 0 12px rgba(255,170,0,.8),0 2px 0 #7a4600}
  .diwali .fest{display:block}
  .dw-note{position:absolute;bottom:8px;left:0;right:0;text-align:center;z-index:3;font:600 12px/1.2 'Noto Sans Devanagari','Montserrat',sans-serif;color:#ffe9a8;opacity:.85;letter-spacing:.02em}
  #fw{position:absolute;inset:0;width:100%;height:100%;z-index:6}
  @media (max-width:640px){
    .diwali .poster{--u:min(1vw,.6vh);--toran:62px;padding-bottom:160px}
    .dw-cas{width:88px}
    .dw-cor{width:130px}
    .dw-row{left:8px;right:8px;bottom:128px;justify-content:space-evenly}
    .dw-note{bottom:98px}
    .dw-row span{width:32px;height:28px}
    .dw-hang{display:none}
  }
  @media (max-width:1100px) and (min-width:641px){.dw-cor{width:240px}.dw-row{left:270px;right:270px}}
  @media (prefers-reduced-motion:reduce){.dw-hang,.dw-glow,.dw-row img{animation:none;opacity:1}}
</style>
</head>
<body>
<main class="poster">
  <div class="fx" id="fx" aria-hidden="true"></div>

  <svg class="star" viewBox="-100 -100 200 200" aria-hidden="true">
    <defs>
      <radialGradient id="g"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#ffd24a"/><stop offset=".65" stop-color="#ff9a10" stop-opacity=".7"/><stop offset="1" stop-color="#ff7a00" stop-opacity="0"/></radialGradient>
    </defs>
    <circle r="48" fill="url(#g)"/>
    <g stroke-linecap="round" fill="none">
      <path d="M-98 0H98" stroke="#fff3c4" stroke-width="3"/>
      <path d="M0 -98V98" stroke="#ffd23a" stroke-width="3"/>
      <path d="M0 -96V-38M0 38V96" stroke="#fff" stroke-width="5"/>
      <g stroke="#ffc21a" stroke-width="4.5">
        <path d="M-66 -38L-36 -21"/><path d="M66 -38L36 -21"/>
        <path d="M-66 38L-36 21"/><path d="M66 38L36 21"/>
      </g>
      <g stroke="#fff" stroke-width="4.5">
        <path d="M-38 -66L-21 -36"/><path d="M38 -66L21 -36"/>
      </g>
      <g stroke="#ffb35a" stroke-width="4">
        <path d="M-38 66L-21 36"/><path d="M38 66L21 36"/>
      </g>
    </g>
    <circle r="7" fill="#fff"/>
  </svg>

  <h1 class="espila">ESPILA</h1>
  <div class="is">is</div>
  <div class="born">BORN</div>
  <p class="tag">Today, Tomorrow <b>&amp;</b> Beyond...</p>
  <p class="fest" id="fest"></p>
  <div class="dw dw-toran" aria-hidden="true"></div>
  <img class="dw dw-cas l" id="dw-cl" alt="" aria-hidden="true"><img class="dw dw-cas r" id="dw-cr" alt="" aria-hidden="true">
  <img class="dw dw-cor l" id="dw-bl" alt="" aria-hidden="true"><img class="dw dw-cor r" id="dw-br" alt="" aria-hidden="true">
  <div class="dw" id="dw-hangs" aria-hidden="true"></div>
  <div class="dw dw-row" id="dw-row" aria-hidden="true"></div>
  <p class="dw dw-note" id="dw-note"></p>
  <canvas class="dw" id="fw" aria-hidden="true"></canvas>
</main>

<script>
(function(){
  var box=document.getElementById('fx');
  var bright=['#ffc400','#ff2e93','#ffffff','#ff6ad5','#ff9500','#27e0ff','#7dff5a'];
  var gold=['#ffd400','#ffb300','#fff2a0','#ff9d00'];
  var s=11;function r(){s=(s*9301+49297)%233280;return s/233280}
  function add(cls,col,w,h,rot){
    var e=document.createElement('i');e.className=cls;
    e.style.left=(r()*100)+'%';e.style.top=(r()*100)+'%';
    e.style.width='calc('+w+' * var(--u))';e.style.height='calc('+h+' * var(--u))';
    e.style.background=col;e.style.color=col;
    if(rot!==null)e.style.transform='rotate('+rot+'deg)';
    box.appendChild(e);return e;
  }
  for(var i=0;i<85;i++){
    var z=.8+r()*1.8;
    var e=add('c',bright[Math.floor(r()*bright.length)],z,z*(.5+r()*.6),Math.floor(r()*360));
    if(r()<.22){e.style.borderRadius='50%';e.style.height=e.style.width}
  }
  for(var j=0;j<34;j++){
    var q=2+r()*4.5;
    var st=add('sp',r()<.7?gold[Math.floor(r()*gold.length)]:'#ffffff',q,q,null);
    st.style.setProperty('--d',(1.6+r()*2.4).toFixed(2)+'s');
    st.style.setProperty('--dl',(r()*3).toFixed(2)+'s');
  }
})();
</script>

<script>
// दीपावली की सजावट: 6 से 10 नवंबर 2026 (जाँच के लिए पते में ?diwali=7)
(function(){
  var FEST={6:"शुभ धनतेरस",7:"छोटी दीपावली की शुभकामनाएँ",8:"शुभ दीपावली",9:"गोवर्धन पूजा की शुभकामनाएँ",10:"भाई दूज की शुभकामनाएँ"};
  var now=new Date(),day=null,m=/[?&]diwali=(\d{1,2})/.exec(location.search);
  if(m&&FEST[+m[1]])day=+m[1];else if(now.getFullYear()===2026&&now.getMonth()===10&&FEST[now.getDate()])day=now.getDate();
  if(!day)return;
  var B="https://espilamail.com/";
  document.documentElement.classList.add("diwali");
  document.getElementById("fest").textContent="✨ "+FEST[day]+" ✨";
  document.getElementById("dw-note").textContent="स्क्रीन पर कहीं भी छूकर आतिशबाज़ी देखिए ✨";
  document.getElementById("dw-cl").src=document.getElementById("dw-cr").src=B+"dw-cascade.webp";
  document.getElementById("dw-bl").src=document.getElementById("dw-br").src=B+"dw-corner.webp";
  var row=document.getElementById("dw-row"),hb=document.getElementById("dw-hangs");
  function draw(){
    var W=innerWidth,mob=W<641;
    row.innerHTML="";
    var n=Math.max(5,Math.min(16,Math.round((row.clientWidth||W)/(mob?44:64))));
    for(var i=0;i<n;i++){var sp=document.createElement("span");sp.innerHTML='<img src="'+B+'dw-diya.webp" alt="">';sp.firstChild.style.animationDelay=(.4+i*.12)+"s";row.appendChild(sp);}
    hb.innerHTML="";
    if(mob)return;
    [[.2,105,"l"],[.28,140,"b"],[.36,105,"l"],[.64,105,"l"],[.72,140,"b"],[.8,105,"l"]].forEach(function(p,i){
      var lamp=p[2]==="l",w=lamp?52:72,h=Math.round(w*(lamp?593:673)/200),d=document.createElement("div");
      d.className="dw-hang";d.style.width=w+"px";d.style.left=(p[0]*W-w/2)+"px";d.style.top=(p[1]-h*(lamp?.62:.6))+"px";d.style.animationDelay=(-i*.7)+"s";
      d.innerHTML='<img src="'+B+(lamp?"dw-lamp.webp":"dw-bell.webp")+'" alt="">'+(lamp?'<span class="dw-glow" style="width:40px;height:40px;left:50%;margin-left:-20px;top:'+Math.round(h*.74-20)+'px;animation-delay:'+(-i*.5)+'s"></span>':"");
      hb.appendChild(d);
    });
  }
  draw();var rt;addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(function(){draw();size();},150);});
  // आतिशबाज़ी
  var cv=document.getElementById("fw"),ctx=cv.getContext&&cv.getContext("2d");if(!ctx)return;
  var reduce=matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  var parts=[],running=false,until=0,C=["#FFD54F","#FF8F00","#FF4081","#7C4DFF","#00E5FF","#76FF03","#FFFFFF"];
  function size(){var r=window.devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);}size();
  function burst(x,y){var c=C[Math.floor(Math.random()*C.length)],n=60+Math.floor(Math.random()*24);for(var i=0;i<n;i++){var a=6.283*i/n,s=1.6+Math.random()*2.6;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:Math.random()<.2?"#FFF3C4":c});}}
  function frame(){ctx.clearRect(0,0,innerWidth,innerHeight);
    for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.035;p.vx*=.985;p.vy*=.985;p.l-=.012;if(p.l<=0){parts.splice(i,1);continue;}ctx.globalAlpha=p.l;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,2.8,0,6.283);ctx.fill();}
    ctx.globalAlpha=1;if(Date.now()<until&&Math.random()<.07)burst(innerWidth*(.15+Math.random()*.7),innerHeight*(.15+Math.random()*.35));
    if(parts.length||Date.now()<until)requestAnimationFrame(frame);else{running=false;ctx.clearRect(0,0,innerWidth,innerHeight);}}
  function show(ms,x,y){if(reduce)return;until=Math.max(until,Date.now()+ms);burst(x!=null?x:innerWidth*.5,y!=null?y:innerHeight*.3);if(!running){running=true;requestAnimationFrame(frame);}}
  setTimeout(function(){show(day===8?5000:3000);},700);
  document.addEventListener("click",function(e){show(1600,e.clientX,Math.max(70,e.clientY-40));});
})();
</script>
</body>
</html>
