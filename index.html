<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Espila</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#ffffff;
font-family:'Nunito',sans-serif;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.container{
text-align:center;
}

.logo{
font-size:78px;
font-weight:800;
color:#7B2CF5;
line-height:1;
letter-spacing:-1px;
}

.tagline{
margin-top:18px;
font-size:26px;
font-weight:400;
color:#666666;
letter-spacing:.5px;
}

.footer{
position:fixed;
bottom:22px;
left:0;
right:0;
text-align:center;
font-size:12px;
color:#9a9a9a;
font-weight:400;
}

@media(max-width:768px){

.logo{
font-size:62px;
}

.tagline{
font-size:20px;
margin-top:16px;
}

.footer{
font-size:11px;
bottom:16px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="logo">
Espila
</div>

<div class="tagline">
Today, Tomorrow &amp; Beyond...
</div>

</div>

<div class="footer">
© 2026 Espila. All Rights Reserved.
</div>

</body>
</html>
