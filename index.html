<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Espila</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#ffffff;
    font-family:"Nunito","Segoe UI",Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    color:#333;
}

.container{
    width:100%;
    text-align:center;
    padding:40px 20px;
}

.logo{
    font-size:72px;
    font-weight:700;
    color:#7B2CF5;
    letter-spacing:-1px;
    line-height:1;
}

.tagline{
    margin-top:14px;
    font-size:24px;
    font-weight:400;
    color:#666666;
}

.footer{
    position:fixed;
    bottom:22px;
    left:0;
    width:100%;
    text-align:center;
    font-size:14px;
    color:#B5B5B5;
}

@media (max-width:768px){

.logo{
    font-size:56px;
}

.tagline{
    font-size:20px;
    margin-top:12px;
}

.footer{
    font-size:11px;
    bottom:18px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="logo">
Espila
</div>

<div class="tagline">
Today, Tomorrow &amp; Beyond...
</div>

</div>

<div class="footer">
© 2026 Espila. All Rights Reserved.
</div>

</body>
</html>
