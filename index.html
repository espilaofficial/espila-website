<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espila - Today, Tomorrow & Beyond...</title>
    <!-- Google Fonts: Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;900&display=swap" rel="stylesheet">
    
    <style>
        /* Reset and Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            font-family: 'Nunito', sans-serif;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Top to Bottom Perfect Centering */
            align-items: center;    /* Left to Right Perfect Centering */
            overflow: hidden;
        }

        /* Main Content Area (Logo + Tagline) */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* Brand Title Style (Increased by 25% & Extra Bold) */
        .brand-title {
            color: #7B2CF5; /* Royal Purple */
            font-weight: 900; /* Extra Bold */
            line-height: 1.0;
            margin-bottom: 12px;
        }

        /* Tagline Style (Kept at your preferred original size) */
        .brand-tagline {
            color: #666666; /* Medium Gray */
            font-weight: 400; /* Regular */
        }

        /* Footer Copyright Area fixed at the absolute bottom */
        .footer {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: #B5B5B5; /* Light Gray */
            font-weight: 400;
        }

        /* Typography sizing based on Desktop vs Mobile screens */
        
        /* Desktop Screens */
        @media (min-width: 769px) {
            .brand-title {
                font-size: 105px; /* Boosted up by 25% */
            }
            .brand-tagline {
                font-size: 24px; /* Original clean size */
            }
            .footer {
                font-size: 14px;
            }
        }

        /* Mobile Screens (Matches your 1000901487.jpg requirements) */
        @media (max-width: 768px) {
            .brand-title {
                font-size: 78px; /* Boosted up by 25% from 62px */
            }
            .brand-tagline {
                font-size: 20px; /* Kept at your preferred look */
            }
            .footer {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <!-- Center Content -->
    <div class="main-content">
        <h1 class="brand-title">Espila</h1>
        <p class="brand-tagline">Today, Tomorrow & Beyond...</p>
    </div>

    <!-- Footer Content -->
    <footer class="footer">
        &copy; 2026 Espila. All Rights Reserved.
    </footer>

</body>
</html>
