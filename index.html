<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espila - Today, Tomorrow & Beyond...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* Reset and Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            font-family: 'Nunito', sans-serif;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
        }

        /* Container to keep things structured */
        .wrapper {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 40px 20px; /* Padding for nice spacing */
        }

        /* Empty top section to balance the vertical centering like the screenshot */
        .top-space {
            flex: 1;
        }

        /* Main Content Area (Logo + Tagline) */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 2; /* Gives more weight to center it properly */
            justify-content: center;
        }

        /* Brand Title Style */
        .brand-title {
            color: #7B2CF5; /* Royal Purple */
            font-weight: 700; /* Bold */
            line-height: 1.1;
            margin-bottom: 15px;
        }

        /* Tagline Style */
        .brand-tagline {
            color: #666666; /* Medium Gray */
            font-weight: 400; /* Regular */
        }

        /* Footer Copyright Area */
        .footer {
            width: 100%;
            text-align: center;
            color: #B5B5B5; /* Light Gray */
            font-weight: 400; /* Regular */
            padding-bottom: 10px;
        }

        /* Typography sizing based on your Style Guide (Desktop vs Mobile) */
        
        /* Desktop Screens (Default) */
        @media (min-width: 769px) {
            .brand-title {
                font-size: 72px;
            }
            .brand-tagline {
                font-size: 24px;
            }
            .footer {
                font-size: 14px;
            }
        }

        /* Mobile Screens (Matches your exact screenshot) */
        @media (max-width: 768px) {
            .brand-title {
                font-size: 56px;
            }
            .brand-tagline {
                font-size: 20px;
            }
            .footer {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="top-space"></div>

        <div class="main-content">
            <h1 class="brand-title">Espila</h1>
            <p class="brand-tagline">Today, Tomorrow & Beyond...</p>
        </div>

        <footer class="footer">
            &copy; 2026 Espila. All Rights Reserved.
        </footer>
    </div>

</body>
</html>
