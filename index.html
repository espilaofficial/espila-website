<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Espila</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#ffffff;
font-family:'Nunito',sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
overflow:hidden;
}

.container{
text-align:center;
padding:20px;
}

.logo{
font-size:clamp(72px,9vw,110px);
font-weight:800;
color:#7B2CFB;
letter-spacing:-2px;
line-height:1;
}

.tagline{
margin-top:14px;
font-size:clamp(18px,2.3vw,30px);
font-weight:500;
color:#707070;
letter-spacing:0.2px;
}

.footer{
position:fixed;
bottom:20px;
left:0;
width:100%;
text-align:center;
font-size:11px;
font-family:Helvetica,Arial,sans-serif;
color:#B5B5B5;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
Espila
</div>

<div class="tagline">
Today, Tomorrow &amp; Beyond...
</div>

</div>

<div class="footer">
© 2026 Espila. All Rights Reserved.
</div>

</body>
</html>
