<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espila is Born</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Mr+Dafoe&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#0d0020;display:flex;align-items:center;justify-content:center;font-family:'Montserrat','Segoe UI',Arial,sans-serif}

  .poster{
    --u:min(1vw,.75vh);
    position:relative;overflow:hidden;
    width:100vw;height:100vh;height:100dvh;
    background:
      radial-gradient(ellipse 60% 45% at 50% 28%,rgba(255,170,30,.40) 0,rgba(255,120,0,0) 70%),
      radial-gradient(ellipse at 50% 55%,#6a14c4 0%,#3d0b86 45%,#1c0442 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  }
  .fx{position:absolute;inset:0;pointer-events:none}
  .fx i{position:absolute;display:block}

  .c{opacity:.95;box-shadow:0 0 calc(1.2 * var(--u)) currentColor}
  .sp{
    background:currentColor;
    clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);
    filter:drop-shadow(0 0 calc(1 * var(--u)) currentColor);
    animation:tw var(--d,2.4s) ease-in-out var(--dl,0s) infinite;
  }
  @keyframes tw{0%,100%{opacity:.25;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(20deg)}}

  .star{width:calc(34 * var(--u));height:calc(34 * var(--u));position:relative;z-index:1;margin-bottom:calc(-1 * var(--u));
    filter:drop-shadow(0 0 calc(3 * var(--u)) #ffb21e) drop-shadow(0 0 calc(7 * var(--u)) rgba(255,140,0,.8));
    animation:pulse 3s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

  .espila{
    position:relative;z-index:1;font-weight:800;font-size:calc(21 * var(--u));line-height:1;letter-spacing:-.01em;color:#fff;
    text-shadow:calc(.4 * var(--u)) calc(.4 * var(--u)) 0 #3a0f78,calc(.8 * var(--u)) calc(.8 * var(--u)) 0 #25094d,
      0 0 calc(2 * var(--u)) rgba(255,255,255,.55),0 0 calc(6 * var(--u)) rgba(200,120,255,.7),0 calc(1.8 * var(--u)) calc(3 * var(--u)) rgba(0,0,0,.5);
  }
  .is{
    position:relative;z-index:1;font-family:'Mr Dafoe',cursive;font-size:calc(10 * var(--u));line-height:1;margin-top:calc(-1 * var(--u));color:#fff;
    text-shadow:0 0 calc(1.5 * var(--u)) #fff,0 0 calc(4 * var(--u)) #ff9bf0;
  }
  .born{
    position:relative;z-index:1;margin-top:calc(1.5 * var(--u));
    font-weight:800;font-size:calc(19 * var(--u));line-height:1;letter-spacing:.01em;
    background:linear-gradient(110deg,#ffe27a 0%,#ffbf14 25%,#fff6b0 45%,#ffb400 62%,#ffd84a 80%,#ff9d00 100%);
    background-size:220% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(calc(.4 * var(--u)) calc(.5 * var(--u)) 0 #7a4600) drop-shadow(0 0 calc(2 * var(--u)) rgba(255,190,20,.9)) drop-shadow(0 0 calc(5 * var(--u)) rgba(255,150,0,.6));
    animation:shine 4s linear infinite;
  }
  @keyframes shine{0%{background-position:100% 0}100%{background-position:-120% 0}}

  .tag{
    position:relative;z-index:1;margin-top:calc(7 * var(--u));
    font-weight:600;font-size:calc(4 * var(--u));letter-spacing:.28em;text-transform:uppercase;color:#fff;
    text-shadow:0 0 calc(1.4 * var(--u)) rgba(255,255,255,.6),0 calc(.4 * var(--u)) calc(1 * var(--u)) rgba(0,0,0,.7);
  }
  .tag b{color:#ffc21a;font-weight:800;text-shadow:0 0 calc(2 * var(--u)) #ff9d00}

  @media (prefers-reduced-motion:reduce){.sp,.star,.born{animation:none}}
</style>
</head>
<body>
<main class="poster">
  <div class="fx" id="fx" aria-hidden="true"></div>

  <svg class="star" viewBox="-100 -100 200 200" aria-hidden="true">
    <defs>
      <radialGradient id="g"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#ffd24a"/><stop offset=".65" stop-color="#ff9a10" stop-opacity=".7"/><stop offset="1" stop-color="#ff7a00" stop-opacity="0"/></radialGradient>
    </defs>
    <circle r="48" fill="url(#g)"/>
    <g stroke-linecap="round" fill="none">
      <path d="M-98 0H98" stroke="#fff3c4" stroke-width="3"/>
      <path d="M0 -98V98" stroke="#ffd23a" stroke-width="3"/>
      <path d="M0 -96V-38M0 38V96" stroke="#fff" stroke-width="5"/>
      <g stroke="#ffc21a" stroke-width="4.5">
        <path d="M-66 -38L-36 -21"/><path d="M66 -38L36 -21"/>
        <path d="M-66 38L-36 21"/><path d="M66 38L36 21"/>
      </g>
      <g stroke="#fff" stroke-width="4.5">
        <path d="M-38 -66L-21 -36"/><path d="M38 -66L21 -36"/>
      </g>
      <g stroke="#ffb35a" stroke-width="4">
        <path d="M-38 66L-21 36"/><path d="M38 66L21 36"/>
      </g>
    </g>
    <circle r="7" fill="#fff"/>
  </svg>

  <h1 class="espila">ESPILA</h1>
  <div class="is">is</div>
  <div class="born">BORN</div>
  <p class="tag">Today, Tomorrow <b>&amp;</b> Beyond...</p>
</main>

<script>
(function(){
  var box=document.getElementById('fx');
  var bright=['#ffc400','#ff2e93','#ffffff','#ff6ad5','#ff9500','#27e0ff','#7dff5a'];
  var gold=['#ffd400','#ffb300','#fff2a0','#ff9d00'];
  var s=11;function r(){s=(s*9301+49297)%233280;return s/233280}
  function add(cls,col,w,h,rot){
    var e=document.createElement('i');e.className=cls;
    e.style.left=(r()*100)+'%';e.style.top=(r()*100)+'%';
    e.style.width='calc('+w+' * var(--u))';e.style.height='calc('+h+' * var(--u))';
    e.style.background=col;e.style.color=col;
    if(rot!==null)e.style.transform='rotate('+rot+'deg)';
    box.appendChild(e);return e;
  }
  for(var i=0;i<85;i++){
    var z=.8+r()*1.8;
    var e=add('c',bright[Math.floor(r()*bright.length)],z,z*(.5+r()*.6),Math.floor(r()*360));
    if(r()<.22){e.style.borderRadius='50%';e.style.height=e.style.width}
  }
  for(var j=0;j<34;j++){
    var q=2+r()*4.5;
    var st=add('sp',r()<.7?gold[Math.floor(r()*gold.length)]:'#ffffff',q,q,null);
    st.style.setProperty('--d',(1.6+r()*2.4).toFixed(2)+'s');
    st.style.setProperty('--dl',(r()*3).toFixed(2)+'s');
  }
})();
</script>
</body>
</html>
