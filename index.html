<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espila - Today, Tomorrow & Beyond...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;900&display=swap" rel="stylesheet">
    
    <style>
        /* Reset and Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            font-family: 'Nunito', sans-serif;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
        }

        /* Container */
        .wrapper {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 40px 20px;
        }

        .top-space {
            flex: 1;
        }

        /* Main Content Area */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 2;
            justify-content: center;
        }

        /* Brand Title Style (Made Extra Bold with 900 weight) */
        .brand-title {
            color: #7B2CF5; /* Royal Purple */
            font-weight: 900; /* Extra Bold / Black */
            line-height: 1.0;
            margin-bottom: 12px;
            letter-style: normal;
        }

        /* Tagline Style (Sized down to fit inside the Espila width) */
        .brand-tagline {
            color: #666666; /* Medium Gray */
            font-weight: 400; /* Regular */
            width: 100%;
            max-width: max-content;
        }

        /* Footer Copyright Area */
        .footer {
            width: 100%;
            text-align: center;
            color: #B5B5B5; /* Light Gray */
            font-weight: 400;
            padding-bottom: 10px;
        }

        /* Responsive Typography Sizing */
        
        /* Desktop Screens */
        @media (min-width: 769px) {
            .brand-title {
                font-size: 84px; /* Slightly increased to give more presence */
            }
            .brand-tagline {
                font-size: 18px; /* Reduced from 24px to keep it contained */
                letter-spacing: 0.5px;
            }
            .footer {
                font-size: 14px;
            }
        }

        /* Mobile Screens */
        @media (max-width: 768px) {
            .brand-title {
                font-size: 62px; /* Slightly increased for better weight */
            }
            .brand-tagline {
                font-size: 14px; /* Reduced from 20px to perfectly fit underneath */
                letter-spacing: 0.2px;
            }
            .footer {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="top-space"></div>

        <div class="main-content">
            <h1 class="brand-title">Espila</h1>
            <p class="brand-tagline">Today, Tomorrow & Beyond...</p>
        </div>

        <footer class="footer">
            &copy; 2026 Espila. All Rights Reserved.
        </footer>
    </div>

</body>
</html>
